# 운영용 nginx 설정 — 프론트엔드 정적 파일(SPA) 서빙 + /api 리버스 프록시.
# docker-compose.prod.yml 에서 frontend 컨테이너의 /etc/nginx/conf.d/default.conf 로 마운트되어,
# 이 nginx 하나가 외부에 노출되는 유일한 진입점(80번 포트)이 된다.
# (backend / mariadb 컨테이너는 외부 포트를 열지 않고 내부 네트워크로만 접근한다.)
#
# HTTPS(443)는 이번 배포 범위 밖. 다음 단계로 Let's Encrypt(certbot) 를 붙이기 쉽도록
# ACME challenge 경로와 443 server 블록 뼈대를 주석으로 남겨둔다(docs/deploy.md 참고).

server {
    listen 80;
    server_name lib.solcho.com;

    root /usr/share/nginx/html;
    index index.html;

    # 업로드/이미지 등 큰 응답 여유
    client_max_body_size 20m;

    # --- (다음 단계) Let's Encrypt HTTP-01 challenge 용 경로 ---
    # certbot webroot 방식 사용 시 아래 주석을 풀고 /var/www/certbot 볼륨을 마운트한다.
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    # --- API 리버스 프록시: /api/* → backend 컨테이너 ---
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- SPA 라우팅: 정적 파일이 없으면 index.html 로 폴백 ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐시(선택)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

