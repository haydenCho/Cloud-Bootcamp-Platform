# 운영용 docker compose (frontend[nginx] / backend / mariadb).
#
# 실행(서버에서):
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d --build
#
# 구조:
# - frontend 컨테이너의 nginx 가 유일한 외부 진입점(80). 정적 SPA 서빙 + /api → backend 프록시.
#   (deploy/nginx/default.conf 를 컨테이너 default.conf 로 마운트)
# - backend / mariadb 는 외부 포트를 열지 않고 compose 내부 네트워크에서 서비스명으로만 접근.
# - 값은 .env.production(루트) 에서 주입. 키 목록은 .env.example / docs/env-vars.md 참고.
#
# 도메인: lib.solcho.com (HTTP). HTTPS(443)는 다음 단계 — docs/deploy.md 참고.

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-bootcamp}
      MARIADB_USER: ${MARIADB_USER:-bootcamp}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env.production}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env.production}
    # 외부에 포트를 노출하지 않는다(내부 네트워크 전용).
    expose:
      - "3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: ${MARIADB_DATABASE:-bootcamp}
      DB_USERNAME: ${MARIADB_USER:-bootcamp}
      DB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env.production}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.production}
      JWT_ACCESS_TOKEN_VALIDITY_MINUTES: ${JWT_ACCESS_TOKEN_VALIDITY_MINUTES:-30}
      JWT_REFRESH_TOKEN_VALIDITY_DAYS: ${JWT_REFRESH_TOKEN_VALIDITY_DAYS:-14}
      ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env.production}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-관리자}
      GUEST_LOGIN_ID: ${GUEST_LOGIN_ID:-guest}
      GUEST_PASSWORD: ${GUEST_PASSWORD:-1234}
      GUEST_NICKNAME: ${GUEST_NICKNAME:-게스트}
      # 프론트와 동일 출처(nginx /api 프록시)라 CORS 는 사실상 트리거되지 않지만, 명시적으로 도메인만 허용.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://lib.solcho.com}
      # refresh 쿠키(HTTP 동일 출처): secure=false, SameSite=Lax, domain 미설정(host-only).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    # 외부 포트 미노출(nginx 를 통해서만 접근).
    expose:
      - "8080"

  frontend:
    build:
      context: ../frontend
      args:
        # Vite 는 빌드 시점에 API URL 을 정적으로 주입한다. 동일 출처(도메인) 기준.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://lib.solcho.com}
    restart: unless-stopped
    depends_on:
      - backend
    # 운영 nginx 설정(정적 서빙 + /api 프록시)을 컨테이너 기본 설정 위에 마운트.
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # 유일한 외부 노출 포트: 80(HTTP).
    ports:
      - "80:80"

volumes:
  mariadb-data:
