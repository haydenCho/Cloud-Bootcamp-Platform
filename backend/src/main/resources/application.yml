spring:
  application:
    name: bootcamp-backend

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bootcamp}?useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:bootcamp}
    password: ${DB_PASSWORD:bootcamp}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      # 초기 개발 단계: 엔티티 기준으로 스키마 자동 갱신. 운영 전환 시 validate/flyway 로 변경.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
    open-in-view: false

server:
  port: 8080

# ---- 애플리케이션 커스텀 설정 ----
app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-long-random-secret-at-least-32-bytes}
    access-token-validity-minutes: ${JWT_ACCESS_TOKEN_VALIDITY_MINUTES:30}
    refresh-token-validity-days: ${JWT_REFRESH_TOKEN_VALIDITY_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # refresh 토큰 쿠키(도메인·프로토콜 의존 값). 기본은 로컬/HTTP 동일 출처용.
  # HTTPS 전환 시 COOKIE_SECURE=true (필요하면 COOKIE_SAME_SITE=Lax 유지)로만 바꾸면 된다.
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
    domain: ${COOKIE_DOMAIN:}
  init:
    admin-login-id: ${ADMIN_LOGIN_ID:admin}
    admin-password: ${ADMIN_PASSWORD:}
    admin-nickname: ${ADMIN_NICKNAME:관리자}
    guest-login-id: ${GUEST_LOGIN_ID:guest}
    guest-password: ${GUEST_PASSWORD:1234}
    guest-nickname: ${GUEST_NICKNAME:게스트}

logging:
  level:
    org.springframework.security: INFO
  file:
    name: ../logs/backend/backend.log
